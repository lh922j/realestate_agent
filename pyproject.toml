[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realestate-agent"
version = "0.1.0"
description = "부동산 실거래가 분석 Agentic AI 서비스"
requires-python = ">=3.11"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",

    # DB
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "chromadb>=0.5.0",

    # ML (기존 realestate/ 모델 재사용)
    "lightgbm>=4.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",

    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # 유틸
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # 임베딩
    "sentence-transformers>=3.0",

    # 프론트엔드
    "streamlit>=1.40.0",
    "pydeck>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
